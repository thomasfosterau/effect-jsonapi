# Lockstep sets only; the by-hand steps are in docs/CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    assignees: ["thomasfosterau"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
      # @effect/docgen depends on @effect/platform-node at its own release, so it moves with effect.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees: ["thomasfosterau"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    assignees: ["thomasfosterau"]
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
