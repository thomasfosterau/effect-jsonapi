# Dependabot version updates. The `npm` entry at `/` reads the pnpm workspace
# (the library and every `examples/*` app) and its catalogs.
#
# `groups` collect the dependencies that MUST move together, so no lockstep
# set can drift one package at a time. Dependabot puts a dependency in the
# FIRST group that matches it, so the groups run specific → general and use
# `exclude-patterns` where a broader pattern would steal a member:
#
# - `toolchain` — `vite-plus` pins the `oxlint`, `oxfmt` and `vitest` it carries
#   (and `vite` is its aliased core); `@effect/tsgo` patches the native `tsc`
#   (`@typescript/native`, by gitHead) and that `oxlint`, and hard-errors in
#   `pnpm install` on an unsupported pairing; `typescript` is the TS6 half of
#   the 6/7 split; `@vitest/coverage-istanbul` must equal vite-plus's vitest;
#   the Effect lint plugin is wired into the same `vp lint`. Read the comment
#   on `@effect/tsgo` in pnpm-workspace.yaml before merging one of these PRs.
# - `effect` — the Effect release line is a lockstep-versioned singleton set.
# - `docgen` — `@effect/docgen` executes the examples under `tsx`, a peer.
# - `changesets`, `fallow` — each moves as one unit.
# - `minor-and-patch` — every other minor/patch update in one PR; majors
#   outside the sets above stay individual.
#
# Not bumpable here: the transitive floors under `overrides` in
# pnpm-workspace.yaml (`js-yaml`, `launch-editor`, `shell-quote`) — raise or
# drop them by hand (AGENTS.md → Common pitfalls).
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day), with
# first-party packages exempt as `minimumReleaseAgeExclude` exempts them.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@mpsuesser/oxlint-plugin-effect"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
        update-types: ["major", "minor", "patch"]
      docgen:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
    groups:
      github-actions:
        patterns:
          - "*"
