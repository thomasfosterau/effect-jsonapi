name: CI

# ONE job, ONE required check: the pipeline's task graph lives in
# vite.config.ts (the root `check` aggregate), not in GitHub Actions `needs:`.
# Copied in shape from effect-drizzle-ext (the library reference); the docgen
# step is this repository's own contribution to the template.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the single job grants only read access.
permissions: {}

jobs:
  ci:
    name: Format, lint, type-check, test, build & docgen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      - name: Format and lint
        run: vp check

      # The sources, the colocated and type-level tests, every example, and the
      # emitted declarations (which builds `dist/` first — see
      # test/emitted/requirements.types.ts for why consumers see something the
      # source-resolved check does not).
      - name: Type gates (sources, type-level tests, examples, emitted declarations)
        run: vp run --concurrency-limit 2 check

      - name: Unit tests
        run: vp run -r test:unit

      - name: Build
        run: vp run build

      # Type-checks AND runs every JSDoc @example, and generates the API docs.
      - name: Verify documentation examples (docgen)
        run: vp run docgen

      - name: Audit
        run: pnpm audit --audit-level high
