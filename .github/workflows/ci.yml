name: CI

# Every gate lives in the `ci` task in vite.config.ts. The required checks are
# the matrix legs, `ci (node lts)` and `ci (node latest)`.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
        include:
          - node: lts
            node-version: lts
          # setup-vp's `latest` can resolve to a pre-release; `*` cannot.
          - node: latest
            node-version: "*"
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node-version }}
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: true

      - uses: actions/cache@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-

      - run: vp run ci
