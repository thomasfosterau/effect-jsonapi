name: CI

# The repository's single CI workflow. Every gate lives in the `ci` task in
# vite.config.ts, so CI runs `vp run ci` and nothing else after its install,
# and a local `vp run ci` is the same pipeline. The `test` job runs it on each
# Node.js line of the matrix; the `ci` job reduces the matrix to one check.
#
# The matrix covers the active LTS line (`lts`) and the newest released line
# (`latest`). `latest` maps to setup-vp's `node-version: "*"`, which resolves
# to the newest non-pre-release; setup-vp's own `latest` resolves to a
# pre-release (#535), such as a `v27.0.0-alpha` before Node.js 27 ships. Both
# lines may be the same release (an even line once it enters LTS, until the
# next line ships); the run log's `node --version` shows each. package.json's
# `engines.node` (`>=22`) must cover both.
#
# The `ci` job's name is load-bearing: the `Default` ruleset on `trunk`
# must require the check `ci`. Renaming it leaves the required check unreported and
# every pull request blocked. The matrix legs report as `ci (node lts)` and
# `ci (node latest)`.

on:
  pull_request:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  test:
    name: ci (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [lts, latest]
        include:
          - node: lts
            node-version: lts
          - node: latest
            node-version: "*"
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ (the catalog's `vite-plus` pin), Node.js, the `packageManager`
      # pnpm and the dependency cache, then a frozen-lockfile install.
      # `--ignore-scripts` blocks dependency lifecycle scripts (a common
      # supply-chain vector, SECURITY.md); the repository's OWN `prepare`
      # (`vp config && effect-tsgo patch --typescript --oxlint`, the patched
      # binaries every gate runs on) is first-party and is the `ci` task's
      # first step.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: ${{ matrix.node-version }}
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]

      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-node-${{ matrix.node }}-

      - name: Run the CI pipeline
        run: pnpm exec vp run ci

  # One stable check name for the required-check ruleset, whatever the matrix.
  ci:
    name: ci
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix leg to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
