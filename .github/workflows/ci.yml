name: CI

# ONE job on ONE Node.js line, the latest stable release (`node-version:
# latest` in .github/actions/setup), like every other repository in the
# programme (#211). The pipeline's task graph lives in vite.config.ts (the
# root `check` aggregate), not in GitHub Actions `needs:`. Copied in shape
# from effect-drizzle-ext (the library reference); the docgen step is this
# repository's own.
#
# The job name is load-bearing: the `main` ruleset requires the check
# "Lint, type-check, build & test", which GitHub derives from this `name`.
# Renaming it leaves the required check unreported and every PR blocked.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No permissions by default; the job grants only read access.
permissions: {}

jobs:
  ci:
    name: Lint, type-check, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # A modest ceiling for every Node process in the pipeline. NODE_OPTIONS
      # is inherited by every child, including each vitest fork.
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_WORKERS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Restore the Vite+ task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vp-task-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vp-task-v1-${{ runner.os }}-

      # First, so the `check` graph's `build` dependency is a task-cache hit
      # and `typecheck:dist` / docgen read a fresh `dist/`.
      - name: Build
        run: vp run build

      - name: Report the Node.js version under test
        run: node --version

      - name: Format and lint
        run: vp check

      # The sources, the colocated and type-level tests, every example, and the
      # emitted declarations (see test/emitted/requirements.types.ts for why
      # consumers see something the source-resolved check does not).
      - name: Type gates (sources, type-level tests, examples, emitted declarations)
        run: vp run --concurrency-limit 2 check

      - name: Unit tests
        run: vp run -r test:unit

      # Type-checks AND runs every JSDoc @example, and generates the API docs.
      - name: Verify documentation examples (docgen)
        run: vp run docgen

      - name: Audit
        run: pnpm audit --audit-level high
