name: Effect Canary

# Runs the gate against the newest Effect *prerelease* (the "rc" npm dist-tag)
# instead of the version pinned in package.json/pnpm-lock.yaml, so upstream
# breakage surfaces here on a schedule rather than in a consumer's build.
#
# Scheduled + manual only — this never runs on push or pull_request, so a red
# run can never block a PR merge. The job still finishes red in the Actions
# tab (see the final step) and files/refreshes a GitHub issue, because nobody
# watches the Actions tab for a weekly cron.
on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: effect-canary-${{ github.ref }}
  cancel-in-progress: true

# No permissions by default; the single job grants only what it needs.
permissions: {}

jobs:
  canary:
    name: Typecheck, test & docgen against effect@rc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # to file/refresh the failure-notification issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      # Baseline install against the committed lockfile. --ignore-scripts
      # blocks dependency lifecycle scripts (a common supply-chain attack
      # vector) from running.
      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Float every workspace package (root + examples/*) onto the newest
      # Effect prerelease. The "rc" dist-tag is the pre-4.0 release-candidate
      # line this repo currently tracks (see the "effect" devDependency in
      # package.json) — switch this to "beta" or "next" if the project moves
      # to tracking a different prerelease line.
      - name: Install latest Effect prerelease
        run: |
          pnpm add -D -w effect@rc --ignore-scripts
          pnpm --filter "./examples/*" add effect@rc --ignore-scripts

      # The three checks most likely to catch an Effect API/behavior break.
      # Lint and formatting are deliberately skipped: they have nothing to do
      # with the Effect version and would only add unrelated noise to a
      # canary result. Each step runs even if an earlier one fails, so a
      # single run reports typecheck/test/docgen status independently.
      - name: Type-check (incl. type-level tests)
        id: typecheck
        continue-on-error: true
        run: pnpm run typecheck

      - name: Test
        id: test
        continue-on-error: true
        run: pnpm test

      # Type-checks AND runs every JSDoc @example against the new Effect version.
      - name: Verify documentation examples (docgen)
        id: docgen
        continue-on-error: true
        run: pnpm run docgen

      - name: Open or refresh an issue if the canary is red
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.docgen.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          DOCGEN_OUTCOME: ${{ steps.docgen.outcome }}
        run: |
          set -euo pipefail

          title="Effect canary is red against effect@rc"

          body=$(jq -n \
            --arg run "$RUN_URL" \
            --arg typecheck "$TYPECHECK_OUTCOME" \
            --arg test "$TEST_OUTCOME" \
            --arg docgen "$DOCGEN_OUTCOME" \
            '"The scheduled Effect canary failed against the latest `effect` prerelease (the `rc` npm dist-tag).\n\n" +
             "- typecheck: " + $typecheck + "\n" +
             "- test: " + $test + "\n" +
             "- docgen: " + $docgen + "\n\n" +
             "Run: " + $run + "\n\n" +
             "This does not block any PR by itself — it means the next Effect prerelease is likely to break this library once it stabilizes. Investigate the run, then either fix the break ahead of time or close this out if it turns out to be a fluke in that prerelease."')

          existing=$(curl -sS -G \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "q=repo:$REPO type:issue state:open in:title \"$title\"" \
            "https://api.github.com/search/issues" | jq -r '.items[0].number // empty')

          if [ -n "$existing" ]; then
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$existing/comments" \
              -d "{\"body\": $body}"
          else
            payload=$(jq -n --arg title "$title" --argjson body "$body" '{title: $title, body: $body}')
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues" \
              -d "$payload"
          fi

      # continue-on-error above keeps the job running through all three
      # checks so the issue body above has full information; this step turns
      # that into a real (visible, red) job failure once we're done.
      - name: Fail the job if any check failed
        if: |
          steps.typecheck.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.docgen.outcome == 'failure'
        run: exit 1
