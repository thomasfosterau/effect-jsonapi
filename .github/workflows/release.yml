name: Release

# Changesets, split so only publishing holds `id-token: write` and waits for
# the protected `release` environment. See docs/PUBLISHING.md.

on:
  push:
    branches: [trunk]

permissions: {}

env:
  # pnpm would otherwise re-install WITH lifecycle scripts before
  # `pnpm run` once a manifest looks newer than the install.
  pnpm_config_verify_deps_before_run: "false"

jobs:
  verify-lockfile:
    name: Verify actions.lock
    if: github.repository == 'thomasfosterau/effect-jsonapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the workflow lockfile
        run: gh actions-lock --verify

  select:
    name: Select mode
    needs: verify-lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - id: mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    name: Version packages
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          version-file: pnpm-workspace.yaml
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - id: version
        uses: changesets/action/version@v2.1.2
        with:
          script: vp run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
      - name: Assign the owner to the version PR
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: gh pr edit "$PR_NUMBER" --add-assignee thomasfosterau

  publish:
    name: Publish to npm
    needs: [verify-lockfile, select]
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write # release tags and GitHub releases
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No lifecycle scripts run in this privileged job; pnpm publishes via OIDC itself.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: lts
          version-file: pnpm-workspace.yaml
          cache: false
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      # `vp run release` (vite.config.ts) builds first. `vp pm publish -r`
      # skips a version npm already has, so a trunk push with nothing new to
      # publish is a no-op; then `changeset git-tag` reports the new tag through
      # CHANGESETS_OUTPUT, and the action pushes it and creates the release.
      - uses: changesets/action/publish@v2.1.2
        with:
          script: vp run release
