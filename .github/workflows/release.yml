name: Release

# Changesets release flow, split so that only publishing waits for approval.
# On every push to `trunk`:
#
# - `select` (read-only) asks changesets/action/select-mode what the repo state
#   calls for: `version` while unreleased changesets exist, `publish` once none
#   remain and some package version is not on npm yet (`changeset
#   publish-plan`), else `none`.
# - `version` opens/updates the "chore: version packages" PR. It holds a
#   write-scoped token but no `id-token`, so it cannot publish, and runs outside
#   the `release` environment, so it needs no approval.
# - `publish` is the only job in the protected `release` environment and the
#   only one with `id-token: write`: it publishes to npm via OIDC trusted
#   publishing and tags the release, after the owner approves it (once per
#   release). See PUBLISHING.md.
#
# changesets/action's README recommends its sub-actions over the combined
# action for trusted publishing, "to tighten publish permissions"; they need
# Changesets CLI v3. The version and publish sub-actions push through the
# GitHub API, so no checkout keeps git credentials.

on:
  push:
    branches: [trunk]

# No permissions by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Same setup as `publish` (see the comments there), minus the build.
  select:
    name: Select mode
    if: github.repository == 'thomasfosterau/effect-jsonapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env: &id001
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+, Node.js, pnpm and the dependency cache, then a frozen-lockfile
      # install with `--ignore-scripts`. The repository's `prepare` does not
      # run here (see the `publish` job).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "*"
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    env: *id001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite+, Node.js, pnpm and the dependency cache, then a frozen-lockfile
      # install with `--ignore-scripts`. The repository's `prepare` does not
      # run here (see the `publish` job).
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "*"
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]
      - name: Create or update the version PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    name: Publish to npm
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    # That guard is on `select` now: this job needs it, so it is skipped with it.
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One publish at a time; never cancel one that has started.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the release tags and create the GitHub releases
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` (`pnpm run version` / `pnpm run release`) it
      # compares node_modules with the manifests and, if a manifest looks newer than the last install,
      # re-installs WITH lifecycle scripts, ignoring the setup step's
      # `--ignore-scripts`. That re-install runs every `allowBuilds`
      # dependency's build script (`esbuild`, `fallow`, `msgpackr-extract`)
      # inside this job, which holds `id-token: write`. It triggers whenever a
      # manifest's mtime moves after the install, e.g. a `git checkout` /
      # `git reset --hard` by the Changesets action before `pnpm run version`.
      # Set per job rather than for the whole workflow file's setup because CI,
      # which shares the setup, keeps the default. pnpm 11 reads only
      # the `pnpm_config_*` spelling for this setting;
      # `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout

        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs with --ignore-scripts (dependency install scripts never run in
      # the privileged publish job — the Shai-Hulud vector). No step runs the
      # repository's `prepare` either (`vp config` git hooks +
      # `effect-tsgo patch`, which executes dependency code): nothing here
      # needs it — `vp run build` emits a byte-identical `dist/` on the
      # unpatched toolchain — and without `vp config` no git hook runs when the
      # Changesets action commits the version bump. That only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see the job
      # `env` above).
      # Node.js is pinned on this job to a release whose bundled npm is at
      # least 11.5.1 (26.13.1 bundles npm 11.20.0), the floor for npm's OIDC
      # trusted publishing, so the job never depends on what `*` resolves to
      # on the day. Bump it by hand; Dependabot does not see it.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26.13.1"
          version-file: pnpm-workspace.yaml
          cache: true
          run-install: |
            - args: ["--frozen-lockfile", "--ignore-scripts"]

      - name: Build
        run: pnpm exec vp run build

      # Once the version PR has merged (no changesets remain), this runs `pnpm
      # run release`, which publishes with `pnpm publish --recursive
      # --ignore-scripts` — npm OIDC trusted publishing (there is no NPM_TOKEN
      # to steal) — and then `changeset git-tag`. `--ignore-scripts` keeps the
      # package's `prepublishOnly` (`vp run build`, already done by the Build
      # step above) and `prepare` (`effect-tsgo patch`) out of this job; the
      # tarball is byte-identical either way.
      #
      # The publish branch runs on EVERY push to trunk with no pending
      # changesets, not only the Version Packages merge, so it must be a no-op
      # when the current version is already on npm. `--recursive` is what makes
      # it one: a recursive `pnpm publish` skips any workspace package whose
      # version the registry already has ("There are no new packages that
      # should be published") and exits 0, as `changeset publish` does, while
      # a single-package `pnpm publish` tries to publish over it and exits 1.
      # The root is a workspace member and the examples are private, so the
      # recursive publish covers exactly this package.
      #
      # The action passes `CHANGESETS_OUTPUT` (a temp NDJSON path) to the
      # script; `changeset git-tag` reads it from the environment and appends
      # one `git-tag` event per tag it creates. The action reads that file to
      # push the tags and create the GitHub releases. Already-tagged versions
      # (checked locally and on the remote) produce no event.
      #
      # `pnpm publish`, not `npm publish`: pnpm 11 performs trusted publishing
      # itself (it mints the OIDC token; it no longer delegates to the npm
      # CLI, so npm is never upgraded here), and it is what rewrites the
      # `catalog:peers` specifiers in package.json into the peer ranges
      # consumers actually see — npm would publish the literal `catalog:`
      # protocol.
      #
      # Provenance: pnpm 11 takes settings like `provenance` only from
      # `pnpm_config_*` (an `NPM_CONFIG_PROVENANCE` would be ignored), and none
      # is set here. Left unset, pnpm attaches provenance by itself only when
      # the OIDC token reports a public repository AND the registry reports
      # the package as public; while this repository is private it skips it
      # with a warning (ERR_PNPM_PROVENANCE_INSUFFICIENT_INFORMATION). Forcing
      # it on would make npm reject a publish from a private repo.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Publish to npm
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
