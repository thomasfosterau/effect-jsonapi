name: Release

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/effect-jsonapi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 defaults `verify-deps-before-run` to `install`: before any
      # `pnpm run` / `pnpm exec` (the setup action's `pnpm run prepare`, then
      # `pnpm run version` / `pnpm run release`) it compares node_modules with
      # the manifests and, if a manifest looks newer than the last install,
      # re-installs WITH lifecycle scripts, ignoring the setup action's
      # `--ignore-scripts`. That re-install runs every `allowBuilds`
      # dependency's build script (`esbuild`, `fallow`, `msgpackr-extract`)
      # inside this job, which holds `id-token: write`. It triggers whenever a
      # manifest's mtime moves after the install, e.g. a `git checkout` /
      # `git reset --hard` by the Changesets action before `pnpm run version`.
      # Set here rather than in `.github/actions/setup` because that action
      # is shared with CI, which keeps the default (a job-level
      # `env` reaches the composite action's steps too). pnpm 11 reads only
      # the `pnpm_config_*` spelling for this setting;
      # `npm_config_verify_deps_before_run` is ignored.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs with --ignore-scripts (dependency install scripts never run in
      # the privileged publish job — the Shai-Hulud vector). `run-prepare:
      # "false"` also skips the repository's `prepare` (`vp config` git hooks +
      # `effect-tsgo patch`, which executes dependency code): nothing here
      # needs it — `vp run build` emits a byte-identical `dist/` on the
      # unpatched toolchain — and without `vp config` no git hook runs when the
      # Changesets action commits the version bump. That only holds because
      # `pnpm_config_verify_deps_before_run` is off for this job (see the job
      # `env` above).
      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          run-prepare: "false"

      - name: Build
        run: vp run build

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release`, which publishes with `pnpm publish
      # --recursive --ignore-scripts` — npm OIDC trusted publishing (there is
      # no NPM_TOKEN to steal) — and then `changeset git-tag`. `--ignore-scripts`
      # keeps the package's `prepublishOnly` (`vp run build`, already done by
      # the Build step above) and `prepare` (`effect-tsgo patch`) out of this
      # job; the tarball is byte-identical either way.
      #
      # The publish branch runs on EVERY push to trunk with no pending
      # changesets, not only the Version Packages merge, so it must be a no-op
      # when the current version is already on npm. `--recursive` is what makes
      # it one: a recursive `pnpm publish` skips any workspace package whose
      # version the registry already has ("There are no new packages that
      # should be published") and exits 0, as `changeset publish` does, while
      # a single-package `pnpm publish` tries to publish over it and exits 1.
      # The root is a workspace member and the examples are private, so the
      # recursive publish covers exactly this package.
      #
      # The action passes `CHANGESETS_OUTPUT` (a temp NDJSON path) to the
      # script; `changeset git-tag` reads it from the environment and appends
      # one `git-tag` event per tag it creates. The action reads that file to
      # push the tags and create the GitHub releases. Already-tagged versions
      # (checked locally and on the remote) produce no event.
      #
      # `pnpm publish`, not `npm publish`: pnpm 11 performs trusted publishing
      # itself (it mints the OIDC token; it no longer delegates to the npm
      # CLI, so npm is never upgraded here), and it is what rewrites the
      # `catalog:peers` specifiers in package.json into the peer ranges
      # consumers actually see — npm would publish the literal `catalog:`
      # protocol.
      #
      # Provenance: pnpm 11 takes settings like `provenance` only from
      # `pnpm_config_*` (an `NPM_CONFIG_PROVENANCE` would be ignored), and none
      # is set here. Left unset, pnpm attaches provenance by itself only when
      # the OIDC token reports a public repository AND the registry reports
      # the package as public; while this repository is private it skips it
      # with a warning (ERR_PNPM_PROVENANCE_INSUFFICIENT_INFORMATION). Forcing
      # it on would make npm reject a publish from a private repo.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
