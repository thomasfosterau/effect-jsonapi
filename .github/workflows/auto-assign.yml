name: Auto-assign

# Assigns every pull request to the repository owner so the PR list shows who
# has to act on it. Skips Dependabot (its PRs are assigned by `assignees` in
# .github/dependabot.yml) and any PR that already has an assignee.
#
# No checkout and no third-party action: one `gh` call with the job's own
# token. The PR URL reaches the shell through `env:`, never through `${{ }}`
# inside `run:`. `pull_request` (not `pull_request_target`) runs the workflow
# from the PR's head and, for a fork, with a read-only token, so a fork PR
# stays unassigned rather than gaining privileges.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# No permissions by default; the job grants only what it writes.
permissions: {}

jobs:
  assign:
    name: Assign to owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.pull_request.assignees[0] == null &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      pull-requests: write
    steps:
      - name: Assign the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee thomasfosterau
