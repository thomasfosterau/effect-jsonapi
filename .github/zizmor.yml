# zizmor (`uvx zizmor --offline .github`) configuration.
rules:
  # The owner's supply-chain policy is pnpm's `minimumReleaseAge: 480` (8 hours,
  # pnpm-workspace.yaml); Dependabot's cooldown takes whole days only, so 1 day
  # is the shortest setting that never proposes a version pnpm still refuses.
  dependabot-cooldown:
    config:
      days: 1
  # `uses: ./.github/actions/setup` is the local-action form every GitHub
  # Actions runner (and Dependabot's github-actions ecosystem) understands;
  # the `$/…` spelling this help-level audit proposes buys nothing for a
  # checkout of this same repository.
  self-repository:
    disable: true
