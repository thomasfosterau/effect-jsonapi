# The library at the root (a member so Changesets publishes it) plus its
# private examples. Every external version lives in this catalog.
packages:
  - "."
  - "examples/*"

catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  # Executes every JSDoc `@example` under `vpx` (scripts/bin/tsx) against `dist/`.
  "@effect/docgen": ^4.1.2
  "@effect/language-service": ^0.87.3
  # `prepare` runs `effect-tsgo patch --typescript --oxlint --tsrs`, which
  # hard-errors on a `@typescript/native` or vite-plus oxlint / tsrs version
  # missing from the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs. Read it before bumping any
  # of them.
  "@effect/tsgo": 0.73.4
  # Peers `effect` at its own version.
  "@effect/vitest": 4.1.5
  "@enfect/oxlint": 0.10.0
  # Only its Schema subpaths are imported; none of its types reach our
  # declarations. 0.2.0 is the first with `Issues.leaves` / `Issues.message`.
  "@thomasfosterau/effect-ext": ^0.2.0 || ^0.3.0 || ^0.4.0
  "@types/node": ^26.4.1
  # Must equal the vitest vite-plus bundles.
  "@vitest/coverage-istanbul": 5.1.1
  # Tracks `latest`; consumers see the `catalogs.peers` range.
  effect: 4.1.5
  fallow: 3.48.0
  # TypeScript 6/7 side by side: JS-API consumers (the language service, the
  # tsdown declaration bundler, test/entry-points.test.ts) need TS6 (`tsc6`);
  # the native TS7 `tsc` runs the type gates. Exact: @effect/tsgo patches it.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` and `vitest` must equal what vite-plus itself depends on (`npm view
  # vite-plus@<v> dependencies`); `vite` no longer equals vite-plus.
  vite-plus: 1.8.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.2

# Published peer ranges. Raise `effect` only when a dependency (or effect's own
# HttpApi types) needs it; `vp run typecheck:floor` (test/floor/) compiles a
# consumer against the floor exactly.
catalogs:
  peers:
    effect: ^4.1.0

overrides:
  # `effect` must be a singleton.
  effect: "catalog:"
  # One `vite` (vite-plus's aliased core) and one `vitest` throughout.
  vite@*: "catalog:"
  vitest@*: "catalog:"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

# Hold new versions for 24 hours; first-party packages are exempt.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@thomasfosterau/*"
# Vite+ selects Node.js (.node-version) and pnpm (packageManager); pnpm
# must not download or switch to its own.
runtimeOnFail: ignore
pmOnFail: ignore
# docgen runs its examples with `tsx`, which scripts/bin/tsx stands in for
# (through vpx), so its `tsx` peer is optional and never installed.
packageExtensions:
  "@effect/docgen":
    peerDependenciesMeta:
      tsx:
        optional: true
