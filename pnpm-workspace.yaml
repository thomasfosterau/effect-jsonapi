# pnpm workspace — the library at the repo root plus its worked examples.
#
# Listing "." makes the root a workspace member so Changesets versions and
# publishes it (a workspace *root* on its own is not a publishable package).
# The examples under `examples/*` are private packages alongside it: each is
# type-checked and tested against the live `src/`, never against `dist/`.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` (or `workspace:*` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# Versions are kept in lockstep with the consuming applications' catalogs
# (website / gardeneria / preferenceflow) wherever the two overlap — effect,
# vite-plus, the TypeScript 6/7 pair, @effect/tsgo, fallow — so the library
# builds against exactly what they run. Two deliberate deviations:
# `vite-plus`, pinned one release ahead of the applications so that the
# `oxlint` it carries is one `@effect/tsgo` 0.47 can patch (see both notes);
# and `effect`, which tracks the `latest` dist-tag ahead of the applications'
# lockstep (see that entry).
packages:
  - "."
  - "examples/*"

catalogMode: strict

catalog:
  "@changesets/cli": ^3.0.3
  # Compiles AND executes every JSDoc `@example` (`vp run docgen`); runs the
  # examples under `tsx`, hence that entry below. Drives TypeScript through the
  # JS API, so it sees the TS6 side of the split.
  "@effect/docgen": ^0.5.2
  "@effect/language-service": ^0.87.3
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.47.2 ships against typescript 7.0.2).
  #
  # The root `prepare` script runs `effect-tsgo patch --typescript --oxlint`,
  # so this ALSO pins in lockstep with the `oxlint` that `vite-plus` pulls in
  # (see that entry). Each @effect/tsgo release ships artifacts for an explicit
  # set of component versions and hard-errors
  # (UnsupportedTargetPackageVersionError) on anything else, failing
  # `pnpm install` itself rather than a later task: 0.47.2 supports typescript
  # 7.0.2 / 7.1.0-dev.20260929.1, oxlint 1.82.0-1.86.0 and oxlint-tsgolint
  # 7.0.2001 / 7.0.2003. 0.47.0 is also the first release with the
  # `unstableApiUsage` rule that tsconfig.base.json lowers to "suggestion"
  # (#205). Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.47.2
  "@mpsuesser/oxlint-plugin-effect": ^0.5.0
  "@types/node": ^26.4.1
  # Deliberately tracks the `latest` dist-tag, ahead of the applications'
  # lockstep, so the gates run against the newest `effect` release. What
  # consumers may resolve is the `catalogs.peers` range, whose floor is
  # verified separately.
  effect: 4.0.0
  effect-solutions: ^0.5.3
  fallow: 3.33.1
  # The runtime `@effect/docgen` executes examples under.
  tsx: ^4.23.13
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, @effect/docgen,
  # the tsdown declaration bundler behind `vp pack`) stay on TS6 while native
  # `tsc` type-checks the sources, the type-level tests and the emitted
  # declarations. The alias keeps the package importable as `typescript`
  # name-stable at the TS6 JS compiler (bin `tsc6`); `@typescript/native` is
  # TS7 (bin `tsc`). Pinned exact: @typescript/native's gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions; `vite` is
  # the same release under its aliased core package, and `vitest` must match
  # vite-plus's exact pin because the `vitest: "catalog:"` override forces
  # every resolution to the catalog singleton. 0.3.3 carries oxlint 1.83.0 and
  # oxlint-tsgolint 7.0.2001, both in @effect/tsgo 0.47.2's components table,
  # and keeps vitest 4.1.11 (1.0.0 carries oxlint 1.85.0 but moves vitest to
  # 5.x, a separate upgrade).
  vite-plus: 0.3.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11

# Peer ranges the PUBLISHED package declares. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.118` peer would reject a consumer on rc.117). `pnpm publish`
# replaces `catalog:peers` with these ranges in the published manifest — which
# is why the release publishes with pnpm, not npm.
#
# The `effect` floor is the oldest release the sources compile against, open
# at the top per the shared Effect-floor policy (#115). rc.113 renamed
# `SchemaTransformation.transformOrFail` to `transformEffect` with no overlap
# release, so rc.112 and rc.113+ cannot both be admitted (#171). rc.118 removed
# every `effect/unstable/*` path with no compat export (`effect/unstable/httpapi`
# became `effect/http-api`), so no earlier release resolves the emitted
# declarations (#193). Raising the floor means re-running the gate against the
# new floor, not only the pin.
catalogs:
  peers:
    effect: ">=4.0.0-rc.118"

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # Advisory floors for transitive dependencies of the dev toolchain, which
  # `pnpm audit --audit-level high` (CI's last step) gates. None is reached
  # by the published package: `brace-expansion` arrives via
  # @effect/docgen > glob > minimatch (GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg,
  # GHSA-rgw5-rvv9-x895 — patched in 2.1.4); `js-yaml` 3.x via
  # @effect/docgen > @effect/markdown-toc > gray-matter and effect-solutions >
  # gray-matter (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh —
  # patched in 3.15.2); `shell-quote` via @changesets/cli > launch-editor
  # (GHSA-pqg4-j6r4-53mv — patched in 1.11.0; the locked launch-editor
  # 2.14.1 declares `^1.8.4` (2.14.2 raises it to `^1.10.0`), which admits the
  # fix, but the floor is what moves the locked 1.10.0 and keeps it from
  # coming back). Scoped to the affected major so a consumer of another
  # major elsewhere in the tree keeps its own range. Drop each once its
  # dependent's own range floor excludes the vulnerable versions.
  "brace-expansion@2": ">=2.1.4"
  "js-yaml@3": ">=3.15.2"
  "shell-quote@1": ">=1.11.0"
  # `@mpsuesser/oxlint-plugin-effect` (^0.5.0) declares a peer on an `effect`
  # beta and ships no rc.118 build, so the singleton override above would force
  # it onto rc.118. Pin the plugin's own `effect` to the beta it was built
  # against (owner decision, website#2015). Remove this once the plugin ships an
  # rc.118 build.
  "@mpsuesser/oxlint-plugin-effect>effect": "4.0.0-beta.100"
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  # Arrives via vite-plus; an optional native accelerator (same setting as
  # the applications' catalogs).
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # @effect/docgen declares `typescript ^5.2.2` and drives it through the JS
    # API, which the TS6 alias above still provides (TS6 is the last JS-based
    # compiler line); `vp run docgen` is the proof, in CI on every push.
    "@effect/docgen>typescript": "6"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
